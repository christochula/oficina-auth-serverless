name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1
  TF_VAR_aws_region: us-east-1
  TF_VAR_environment: homolog
  TF_VAR_release_version: ${{ github.sha }}
  # Contratos dos outros repos (GitHub Variables). Fallback para placeholder
  # valido enquanto os repos anteriores nao subiram.
  TF_VAR_db_secret_arn: ${{ vars.DB_SECRET_ARN || 'arn:aws:secretsmanager:us-east-1:519768589921:secret:oficina/homolog/database/connection-PLACEHOLDER' }}
  TF_VAR_jwt_secret_arn: ${{ vars.JWT_SECRET_ARN || 'arn:aws:secretsmanager:us-east-1:519768589921:secret:oficina/homolog/jwt-PLACEHOLDER' }}
  TF_VAR_backend_url: ${{ vars.BACKEND_URL || 'http://backend.placeholder.local' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install, verify and build
        run: npm ci && npm run ci

      - name: Configure AWS credentials (AWS Academy session keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

      - name: Ensure Terraform state bucket
        id: backend
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          BUCKET="oficina-tc3-tfstate-${ACCOUNT_ID}"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region "${AWS_REGION}"
            aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"

      - name: Terraform apply
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="key=oficina/auth/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform -chdir=terraform validate -no-color
          terraform -chdir=terraform apply -input=false -auto-approve

      - name: Publish outputs
        run: terraform -chdir=terraform output
