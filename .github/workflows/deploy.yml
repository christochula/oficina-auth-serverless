name: Deploy

on:
  push:
    branches: [homolog, main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    if: github.ref_name == 'homolog' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
      TF_VAR_release_version: ${{ github.sha }}
      TF_VAR_db_secret_arn: ${{ secrets.DB_SECRET_ARN }}
      TF_VAR_jwt_secret_arn: ${{ secrets.JWT_SECRET_ARN }}
      TF_VAR_datadog_api_key_secret_arn: ${{ secrets.DD_API_KEY_SECRET_ARN }}
      TF_VAR_secrets_kms_key_arns: ${{ vars.SECRETS_KMS_KEY_ARNS_JSON || '[]' }}
      TF_VAR_lambda_subnet_ids: ${{ vars.LAMBDA_SUBNET_IDS_JSON }}
      TF_VAR_lambda_security_group_ids: ${{ vars.LAMBDA_SECURITY_GROUP_IDS_JSON }}
      TF_VAR_vpc_link_subnet_ids: ${{ vars.VPC_LINK_SUBNET_IDS_JSON }}
      TF_VAR_vpc_link_security_group_ids: ${{ vars.VPC_LINK_SECURITY_GROUP_IDS_JSON }}
      TF_VAR_backend_listener_arn: ${{ vars.BACKEND_LISTENER_ARN }}
      TF_VAR_private_integration_tls_server_name: ${{ vars.PRIVATE_INTEGRATION_TLS_SERVER_NAME }}
      TF_VAR_cors_allowed_origins: ${{ vars.CORS_ALLOWED_ORIGINS_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install, verify and build
        run: npm ci && npm run ci
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: gha-auth-${{ github.run_id }}
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Terraform init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: >-
          terraform -chdir=terraform init -input=false
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="key=auth-serverless/${TF_VAR_environment}/terraform.tfstate"
          -backend-config="region=${TF_VAR_aws_region}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - name: Terraform plan
        run: terraform -chdir=terraform plan -input=false -out=deployment.tfplan
      - name: Apply the reviewed plan
        run: terraform -chdir=terraform apply -input=false -auto-approve deployment.tfplan
      - name: Publish non-sensitive deployment outputs
        run: terraform -chdir=terraform output
